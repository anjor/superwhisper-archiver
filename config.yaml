# Superwhisper Archiver Configuration
superwhisper:
  recordings_path: /Users/anjor/Documents/superwhisper/recordings

archive:
  repo_path: /Users/anjor/repos/anjor/granola-notes
  remote_name: origin
  default_branch: main

filters:
  # Meeting-mode captures lasting at least a minute. The floor skips the
  # accidental sub-second taps that Meeting mode collects.
  modes: ["meeting"]
  min_duration_ms: 60000
  # Long mic-only conversations recorded in a dictation mode, which are
  # meetings in everything but the mode they were captured with.
  long_recording_modes: ["super"]
  long_recording_min_duration_ms: 300000

# A call is often captured as several recordings, because stopping and
# restarting starts a new directory. Recordings closer together than the gap
# for their mode are archived as one note.
grouping:
  gap_seconds:
    # Meetings tolerate long pauses; they are rare enough that a generous gap
    # never fuses two distinct meetings.
    meeting: 1200
    # Dictation needs a tight gap, or a burst of unrelated snippets adds up
    # past the long-recording floor and masquerades as a meeting.
    super: 60
  default_gap_seconds: 60

logging:
  level: INFO
  file: /tmp/superwhisper-archiver.log
